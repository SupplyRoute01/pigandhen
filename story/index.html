<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="피그앤헨 주얼리와 브랜드 이야기를 전하는 공식 수입사 저널입니다.">
    <meta name="theme-color" content="#0a0a0a">
    <title>피그앤헨 이야기 | Pig &amp; Hen</title>
    <link rel="preconnect" href="https://pigandhen.asia">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <div class="announcement">PIG &amp; HEN JOURNAL · SUPPLY ROUTE</div>
    <header class="journal-header">
      <a class="journal-brand" href="../index.html#home" aria-label="피그앤헨 홈">
        <img src="https://pigandhen.asia/cdn/shop/files/pigandhen.svg?height=96&amp;v=1768827091" width="222" height="48" alt="Pig &amp; Hen">
      </a>
      <nav aria-label="저널 메뉴">
        <a href="../index.html#stories">모든 이야기</a>
        <a href="../index.html#products">제품 보기</a>
      </nav>
    </header>

    <main id="main" class="journal-main">
      <div class="journal-state" data-loading role="status">이야기를 불러오고 있습니다.</div>

      <article data-article hidden>
        <header class="article-hero">
          <p class="eyebrow">Pig &amp; Hen journal</p>
          <h1 data-title></h1>
          <p class="article-intro" data-excerpt></p>
          <div class="article-meta">
            <span data-author></span>
            <time data-date></time>
          </div>
        </header>

        <div class="article-layout">
          <aside class="article-rail" aria-label="글 탐색">
            <span>JOURNAL</span>
            <a href="../index.html#stories">← 이야기 목록</a>
          </aside>
          <div class="article-body" data-content></div>
        </div>

        <section class="article-faq" aria-labelledby="faq-title">
          <p class="eyebrow">Frequently asked questions</p>
          <h2 id="faq-title">관련 FAQ</h2>
          <dl data-faq></dl>
        </section>

        <nav class="related-stories" aria-labelledby="related-title">
          <p class="eyebrow">Continue reading</p>
          <h2 id="related-title">다른 이야기</h2>
          <div data-related></div>
        </nav>
      </article>

      <section class="journal-error" data-error role="alert" hidden>
        <p class="eyebrow">Story not found</p>
        <h1>글을 불러오지 못했습니다.</h1>
        <p data-error-message>주소를 다시 확인하거나 이야기 목록으로 돌아가 주세요.</p>
        <a class="button button-dark" href="../index.html#stories">이야기 목록으로</a>
      </section>
    </main>

    <footer class="site-footer">
      <a class="footer-logo" href="../index.html#home"><img src="https://pigandhen.asia/cdn/shop/files/logo-inverse.svg?v=1768897428&amp;width=240" width="59" height="48" alt="Pig &amp; Hen"></a>
      <p>HANDMADE FROM AMSTERDAM</p>
      <p>© <span data-year></span> PIG &amp; HEN</p>
    </footer>

    <script>
      const loadingState = document.querySelector('[data-loading]');
      const article = document.querySelector('[data-article]');
      const errorState = document.querySelector('[data-error]');
      const errorMessage = document.querySelector('[data-error-message]');

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const renderInline = (value) => {
        const linkPattern = /\[([^\]]+)]\((https:\/\/[^)\s]+)\)/g;
        let rendered = '';
        let cursor = 0;
        let match = linkPattern.exec(value);

        while (match) {
          rendered += escapeHtml(value.slice(cursor, match.index));
          rendered += `<a href="${escapeHtml(match[2])}" target="_blank" rel="noopener noreferrer">${escapeHtml(match[1])}</a>`;
          cursor = match.index + match[0].length;
          match = linkPattern.exec(value);
        }

        return rendered + escapeHtml(value.slice(cursor));
      };

      const renderContent = (content) => content
        .split('\n\n')
        .filter(Boolean)
        .map((block) => {
          if (block.startsWith('## ')) return `<h2>${escapeHtml(block.slice(3))}</h2>`;
          return `<p>${renderInline(block).replaceAll('\n', '<br>')}</p>`;
        })
        .join('');

      const formatDate = (date) => new Intl.DateTimeFormat('ko-KR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      }).format(new Date(`${date}T00:00:00`));

      const showError = (message) => {
        loadingState.hidden = true;
        article.hidden = true;
        errorMessage.textContent = message;
        errorState.hidden = false;
      };

      const renderStory = (post, posts) => {
        document.title = `${post.title} | 피그앤헨`;
        document.querySelector('meta[name="description"]').setAttribute('content', post.excerpt);
        document.querySelector('[data-title]').textContent = post.title;
        document.querySelector('[data-excerpt]').textContent = post.excerpt;
        document.querySelector('[data-author]').textContent = post.author;

        const publishedDate = document.querySelector('[data-date]');
        publishedDate.dateTime = post.publishedAt;
        publishedDate.textContent = formatDate(post.publishedAt);
        document.querySelector('[data-content]').innerHTML = renderContent(post.content);

        const faqList = document.querySelector('[data-faq]');
        post.faq.forEach(({ q, a }) => {
          const item = document.createElement('div');
          item.className = 'faq-item';
          const question = document.createElement('dt');
          const answer = document.createElement('dd');
          question.textContent = q;
          answer.textContent = a;
          item.append(question, answer);
          faqList.append(item);
        });

        const relatedList = document.querySelector('[data-related]');
        posts.filter(({ slug }) => slug !== post.slug).forEach((relatedPost, index) => {
          const link = document.createElement('a');
          link.className = 'related-story';
          link.href = `?slug=${encodeURIComponent(relatedPost.slug)}`;
          const label = document.createElement('span');
          const title = document.createElement('strong');
          label.textContent = `0${index + 1} / JOURNAL`;
          title.textContent = relatedPost.title;
          link.append(label, title);
          relatedList.append(link);
        });

        loadingState.hidden = true;
        article.hidden = false;
      };

      const loadStory = async () => {
        const slug = new URLSearchParams(window.location.search).get('slug');
        if (!slug) {
          showError('읽을 글이 지정되지 않았습니다. 이야기 목록에서 글을 선택해 주세요.');
          return;
        }

        try {
          const response = await fetch('posts.json', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const { posts } = await response.json();
          const post = posts.find((item) => item.slug === slug);
          if (!post) {
            showError('해당 글을 찾을 수 없습니다. 이야기 목록에서 다른 글을 선택해 주세요.');
            return;
          }
          renderStory(post, posts);
        } catch (error) {
          showError('글을 불러오는 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.');
        }
      };

      document.querySelector('[data-year]').textContent = new Date().getFullYear();
      loadStory();
    </script>
  </body>
</html>
